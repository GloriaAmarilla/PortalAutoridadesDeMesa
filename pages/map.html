<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Sedes - Portal de Mesas</title>
    
    <!-- Leaflet CSS (Api requerida para utilizar el mapa en nuestra aplicacion) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
     
    <!-- Link al CSS del componente del mapa -->
    <link rel="stylesheet" href="../css/map-styles.css">
    
    <!-- Estilos base para el body momentaneo. Solo es para la prueba, no es el definitivo del mapa -->
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: var(--bg-color, #f4f4f9);
            color: var(--text-primary, #333);
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <h1>Sedes y Charlas de Orientación</h1>

    <!-- INICIO DEL BLOQUE DEL MAPA (En el caso de que Apliquemos un modal o insertemos directamente el mapa, debemos copiar el mapa desde este punto) -->
    <div class="mapa-charlas-container">
        <!-- Lista de tarjetas posicionadas a la izquierda -->
        <div class="lista-charlas" id="lista-charlas">
            <!-- Las tarjetas se generan dinámicamente desde map-script.js -->
        </div>
        
        <!-- Contenedor del mapa derecha -->
        <div class="mapa-view" id="mapa-contenedor">
            <!-- El mapa de Leaflet se renderiza aquí -->
        </div>
    </div>
    <!-- FIN DEL BLOQUE DEL MAPA -->

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
     
    <!-- Nuestros scripts (El orden es importante: primero los datos, luego la lógica) -->
    <script src="../js/data-sedes.js"></script>
    <script src="../js/map-script.js"></script>
    <a href="/index.html">Volver a inicio</a>
</body>
</html>
